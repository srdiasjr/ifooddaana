<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c4536a" />
    <meta name="description" content="SaborJá é um projeto de interface de delivery de comida. Peça, acompanhe e organize endereços nesta demonstração." />
    <title>SaborJá — delivery de comida</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='18' width='64' height='64' fill='%23f4c3d0'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='26' font-family='Georgia' fill='%238f3d52'%3ESj%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      (function () {
        var key = "saborja-intro";
        var nav = performance.getEntriesByType("navigation")[0];
        var seen = false;
        try { seen = sessionStorage.getItem(key) === "1"; } catch (e) {}
        var hard = !!(nav && nav.type === "reload" && nav.encodedBodySize > 0 && nav.transferSize >= nav.encodedBodySize && nav.deliveryType !== "cache");
        var first = !seen && (!nav || nav.type === "navigate");
        if (hard || first) {
          try { sessionStorage.setItem(key, "1"); } catch (e) {}
          document.documentElement.classList.add("show-loader");
        } else {
          document.documentElement.classList.add("skip-loader");
        }
      })();
    </script>
    <script>
      (function () {
        var hash = location.hash || "";
        if (hash.indexOf("#/") !== 0) return;
        var path = decodeURIComponent(hash.slice(2));
        var parts = path.split("/");
        var name = parts[0];
        var target = "";
        if (name === "inicio" || name === "") target = "index.html";
        else if (name === "restaurante" && parts[1]) target = "restaurante.html?id=" + encodeURIComponent(parts[1]);
        else if (name === "prato" && parts[1] && parts[2]) target = "prato.html?loja=" + encodeURIComponent(parts[1]) + "&item=" + encodeURIComponent(parts[2]);
        else if (name === "categoria" && parts[1]) target = "busca.html?cat=" + encodeURIComponent(parts[1]);
        else if (name === "acompanhar" && parts[1]) target = "acompanhar.html?id=" + encodeURIComponent(parts[1]);
        else if (["busca", "categorias", "carrinho", "checkout", "pedidos", "favoritos", "cupons", "enderecos", "pagamentos", "perfil", "notificacoes", "ajuda", "entrar"].indexOf(name) !== -1) target = name + ".html";
        if (target && target !== "index.html") location.replace(target);
        else if (name === "inicio") history.replaceState(null, "", "index.html");
      })();
    </script>
  </head>
  <body class="is-loading">
    <script>
      if (document.documentElement.classList.contains("skip-loader")) {
        document.body.classList.remove("is-loading");
      }
    </script>
    <div class="loader" id="loader" role="status" aria-live="polite">
      <div class="loader__bow" aria-hidden="true">
        <svg viewBox="0 0 88 52" width="88" height="52">
          <path d="M44 26c-8-14-28-18-36-8 8 2 16 10 20 18-6 2-16 2-24 8 10 2 22-2 28-8-2 10-2 18 4 24 2-8 6-16 8-34z" fill="#e7a0b4"/>
          <path d="M44 26c8-14 28-18 36-8-8 2-16 10-20 18 6 2 16 2 24 8-10 2-22-2-28-8 2 10 2 18-4 24-2-8-6-16-8-34z" fill="#d97890"/>
          <circle cx="44" cy="27" r="6" fill="#8f3d52"/>
        </svg>
      </div>
      <p class="loader__script">um instante</p>
      <p class="loader__title">SaborJá</p>
      <p class="loader__hint">Aquecendo o forno e arrumando a mesa.</p>
      <span class="loader__ribbon" aria-hidden="true"></span>
    </div>
    <script>
      if (document.documentElement.classList.contains("skip-loader")) {
        var intro = document.getElementById("loader");
        if (intro) intro.remove();
      }
    </script>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="shell">
        <header class="header" id="header"></header>
        <div class="workspace">
          <main class="view" id="main"></main>
          <aside class="bag-panel" id="bag"></aside>
        </div>
      </div>
    </div>
    <nav class="tabbar" id="tabbar"></nav>
    <a class="cart-float" id="cart-float" hidden href="carrinho.html"></a>
    <div id="modal" class="modal" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <script>
      setTimeout(function () {
        var loader = document.getElementById("loader");
        if (loader) loader.remove();
        document.body.classList.remove("is-loading");
      }, 2200);
    </script>
    <script src="js/data.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/pages/home.js"></script>
  </body>
</html>
